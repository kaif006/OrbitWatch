services:
  redis:
    image: redis:alpine
    container_name: neo-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  api:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: neo-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
    ports:
      - "8080:8080"
    depends_on:
      - redis
